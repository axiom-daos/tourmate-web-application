<div class="incident-shell">
  <section class="incident-card">
    <div class="card-header">
      <button mat-stroked-button routerLink="/feedback-and-tour-reviews/reviews" class="back-btn">
        Volver
      </button>
      <h2>{{ isEditMode ? 'Editar Reseña' : 'Publicar Nueva Reseña' }}</h2>
    </div>

    <form [formGroup]="reviewForm" (ngSubmit)="onSubmit()" class="review-form">
      <div class="form-row">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>ID del Tour</mat-label>
          <input matInput type="number" formControlName="tourId" placeholder="Ej. 1" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>ID del Usuario</mat-label>
          <input matInput type="number" formControlName="userId" placeholder="Ej. 9" required>
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Calificación (Rating)</mat-label>
        <mat-select formControlName="rating" required>
          <mat-option [value]="5">5 - Excelente ⭐⭐⭐⭐⭐</mat-option>
          <mat-option [value]="4">4 - Muy Bueno ⭐⭐⭐⭐</mat-option>
          <mat-option [value]="3">3 - Bueno ⭐⭐⭐</mat-option>
          <mat-option [value]="2">2 - Regular ⭐⭐</mat-option>
          <mat-option [value]="1">1 - Malo ⭐</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Comentarios de la Experiencia</mat-label>
        <textarea matInput formControlName="comment" rows="4" placeholder="Describe qué tal estuvo el tour..."></textarea>
      </mat-form-field>

      <div class="form-actions">
        <button mat-stroked-button type="button" routerLink="/feedback-and-tour-reviews/reviews" class="secondary-btn">Cancelar</button>
        <button mat-flat-button class="submit-btn" type="submit" [disabled]="reviewForm.invalid">
          {{ isEditMode ? 'Actualizar Reseña' : 'Publicar Reseña' }}
        </button>
      </div>
    </form>
  </section>
</div>
