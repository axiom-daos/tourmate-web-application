<div class="local-nav">
  <button mat-button type="button">Volver al Inicio</button>
  <button mat-button type="button">Nuevo Incidente</button>
</div>

<div class="incident-container">
  <div class="header-section">
    <h2>Gestión de Incidentes</h2>
    <button mat-flat-button color="primary" class="new-incident-btn" (click)="navigateToNew()">
      <mat-icon>add</mat-icon> Declarar Nuevo Incidente
    </button>
  </div>

  <div class="table-container mat-elevation-z1">
    <table mat-table [dataSource]="dataSource()" matSort>

      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
        <td mat-cell *matCellDef="let element"> #{{element.id}} </td>
      </ng-container>

      <!-- Active Tour ID Column -->
      <ng-container matColumnDef="activeTourId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Tour Activo </th>
        <td mat-cell *matCellDef="let element"> {{element.activeTourId}} </td>
      </ng-container>

      <!-- Reported By User ID Column -->
      <ng-container matColumnDef="reportedByUserId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Reportado Por </th>
        <td mat-cell *matCellDef="let element"> Usuario #{{element.reportedByUserId}} </td>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef> Descripción </th>
        <td mat-cell *matCellDef="let element"> {{element.description}} </td>
      </ng-container>

      <!-- Reported At Column -->
      <ng-container matColumnDef="reportedAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Fecha </th>
        <td mat-cell *matCellDef="let element"> {{element.reportedAt | date:'medium'}} </td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Estado </th>
        <td mat-cell *matCellDef="let element">
          <span class="status-badge {{element.status | lowercase}}">{{element.status}}</span>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let element" class="action-buttons">
          <button mat-stroked-button color="accent" (click)="editIncident(element.id!)">Editar</button>
          <button mat-flat-button color="warn" *ngIf="element.status !== 'RESOLVED' && element.status !== 'CLOSED'" (click)="resolveIncident(element)">Resolver</button>
          <button mat-button color="warn" (click)="deleteIncident(element.id!)">Eliminar</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns; let i = index"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" [showFirstLastButtons]="true"></mat-paginator>
  </div>
</div>
